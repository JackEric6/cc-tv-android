name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '标记为 Pre-release'
        type: boolean
        required: false
        default: false
      build_only:
        description: '只构建未签名 APK artifact，供本机使用原签名证书签名；不创建 Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Set up Python 3.10 (Chaquopy build Python)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install required SDK/NDK & verify
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }

          sdkmanager() { "$SDKMANAGER" "$@"; }

          echo "== 仓库里可用的 API 37 平台 / NDK 27 =="
          ALL="$(sdkmanager --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM  NDK=$NDK  BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::仓库里找不到 android-37 平台"; exit 1; }
          [ -n "$NDK" ] || { echo "::error::仓库里找不到 ndk;27.2.12479018"; exit 1; }

          # --licenses 在无待接受许可时会因管道 broken pipe 返回非 0,故忽略其结果
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          sdkmanager "${ARGS[@]}"

          test -d "$SDK_ROOT/platforms/${PLATFORM#platforms;}" \
            || { echo "::error::$PLATFORM 未安装"; exit 1; }
          test -d "$SDK_ROOT/ndk/${NDK#ndk;}" || { echo "::error::$NDK 未安装"; exit 1; }
          python3 -c "import sys; print('build python:', sys.version)"

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Verify signing material
        if: ${{ inputs.build_only != true }}
        run: |
          test -f .key/app-release.jks || { echo "::error::缺少 .key/app-release.jks"; exit 1; }
          for k in RELEASE_STORE_FILE RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            grep -q "^$k=" gradle.properties || { echo "::error::gradle.properties 缺少 $k"; exit 1; }
          done
          ls -l .key/app-release.jks

      - name: Run Jianpian regression tests
        if: ${{ inputs.build_only == true }}
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.github.tvbox.osc.server.JianpianOriginResolverTest \
            --tests com.github.tvbox.osc.server.JianpianAdapterTest \
            --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename & verify APK
        id: apk
        env:
          VERSION: ${{ inputs.version }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort -V | tail -n1)"
          test -f "$SRC" || { echo "::error::未找到 $SRC"; exit 1; }

          if [ "$BUILD_ONLY" = "true" ]; then
            OUT="cc-tv-${VERSION}-release-unsigned.apk"
          else
            OUT="丛丛影视_${VERSION}_arm64-v8a.apk"
          fi
          cp "$SRC" "$OUT"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)"
          echo "apksigner: $APKSIGNER"
          if [ "$BUILD_ONLY" != "true" ] && [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT" || { echo "::error::APK 签名校验失败"; exit 1; }
          fi
          echo "size: $(du -h "$OUT" | cut -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        if: ${{ inputs.build_only != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned APK artifact
        if: ${{ inputs.build_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-tv-${{ github.event.inputs.version }}-release-unsigned
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
